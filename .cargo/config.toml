# LLVM 18 for the native (`--features native`) codegen.
#
# There is intentionally no [env] entry here: a Cargo build script CANNOT
# propagate env vars to its dependencies' build scripts, so coco_codegen's
# build.rs can't tell llvm-sys where LLVM lives. Instead, provide LLVM 18 one
# of these ways:
#
#   1. Install system LLVM 18 (e.g. `apt-get install llvm-18-dev libpolly-18-dev`)
#      so `llvm-config-18` is on PATH — llvm-sys finds it automatically.
#   2. Run `scripts/fetch-llvm.sh` to download a prebuilt LLVM 18, then export
#      the LLVM_SYS_180_PREFIX it prints into your shell before building.
#   3. If you have LLVM 18 at a fixed path, you may uncomment the [env] block
#      below and set it (this DOES reach llvm-sys, since [env] is applied to
#      every build script's process environment):
#
# [env]
# LLVM_SYS_180_PREFIX = "/usr/lib/llvm-18"
